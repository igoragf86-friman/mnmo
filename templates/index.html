/me').then(function(j){member=j.member;return member}).catch(function(){return null})},visitor:vid};})()</script><link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" type="image/x-icon"><style>[hidden]:not([hidden="until-found"]){display:none!important}</style>

<script>
/* Состояние + локальное хранилище (только чаты) */
const Store={
  mem:{},
  get(k,d){
    try{const v=localStorage.getItem('agt:'+k);if(v!==null)return JSON.parse(v);}catch(e){}
    return (k in this.mem)?this.mem[k]:d;
  },
  set(k,v){this.mem[k]=v;try{localStorage.setItem('agt:'+k,JSON.stringify(v));}catch(e){}}
};
const now=Date.now(),H=3600e3,D=24*H;
function seedConvs(){return {};}

const S={
  me:null,          
  agents:[],
  catalog:[],
  docs:[],
  docsCount:0,
  convs:Store.get('convs',seedConvs()),
  ui:{catQ:'',docQ:'',docExt:'',histQ:''}
};
function save(k){Store.set(k,S[k]);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function allAgents(){return S.agents.concat(S.catalog);}
function getAgent(id){return allAgents().find(a=>String(a.id)===String(id));}
function isMine(id){return S.agents.some(a=>String(a.id)===String(id)&&a.is_owner);}
function fmtSize(b){b=b||0;if(b<1024)return b+' Б';if(b<1048576)return (b/1024).toFixed(b<10240?1:0).replace('.',',')+' КБ';return (b/1048576).toFixed(1).replace('.',',')+' МБ';}
function fmtTime(ts){
  const d=new Date(ts),n=new Date();
  const hm=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===n.toDateString())return 'Сегодня, '+hm;
  const y=new Date(n-D);if(d.toDateString()===y.toDateString())return 'Вчера, '+hm;
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function recentAgents(n){
  return Object.keys(S.convs).map(id=>({a:getAgent(id),u:S.convs[id].updated}))
    .filter(x=>x.a).sort((x,y)=>y.u-x.u).slice(0,n);
}
function tile(a,lg){return '<span class="tile'+(lg?' lg':'')+'" style="--c:'+esc(a.color||'#4f46e5')+'">'+icon(a.icon||'bot')+'</span>';}
function toast(text,type){
  const el=document.createElement('div');el.className='toast'+(type==='error'?' error':'');el.textContent=text;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.remove();},type==='error'?5000:3200);
}
function confirmDlg(title,text,yes){
  return new Promise(res=>{
    const d=document.getElementById('confirmDlg');
    document.getElementById('cTitle').textContent=title;
    document.getElementById('cText').textContent=text;
    document.getElementById('cYes').textContent=yes||'Удалить';
    d.returnValue='';
    d.onclose=()=>res(d.returnValue==='yes');
    d.showModal();
  });
}
function emptyBox(ic,title,text,btn){
  return '<div class="empty"><span class="ico" data-ico="'+ic+'"></span><b>'+title+'</b><span>'+text+'</span>'+(btn||'')+'</div>';
}

/* ---------- API ---------- */
async function apiFetch(path, opts){
  opts = opts || {};
  const r = await fetch(path, Object.assign({ credentials:'same-origin' }, opts));
  if(r.status===401){
    location.href='/login?next='+encodeURIComponent(location.pathname+location.search);
    throw new Error('Требуется вход');
  }
  if(r.status===204) return null;
  const j = await r.json().catch(()=>null);
  if(!r.ok){
    const det = j && (typeof j.detail==='string' ? j.detail
      : (j.detail && (j.detail.message||JSON.stringify(j.detail))) || j.message);
    throw new Error(det || ('Ошибка '+r.status));
  }
  return j;
}
async function loadMe(){
  try{ S.me = await apiFetch('/api/v1/users/me'); }
  catch(e){ S.me = null; }
}
async function loadAgents(){
  try{ S.agents = (await apiFetch('/api/v1/agents')).items || []; }
  catch(e){ S.agents=[]; }
}
async function loadCatalog(){
  try{ S.catalog = (await apiFetch('/api/v1/agents/catalog')).items || []; }
  catch(e){ S.catalog=[]; }
}
async function loadDocs(){
  try{
    const d = await apiFetch('/api/v1/documents?limit=500');
    S.docs = d.items || [];
    S.docsCount = d.total || 0;
  }catch(e){ S.docs=[]; S.docsCount=0; }
}

</script>
<script>
/* Обзор, каталог, агенты, история, настройки */

function agentCard(a,mode){
  const owned = a.is_owner || a.can_edit;
  const shared = a.is_shared_with_me;
  const isCatalog = mode==='catalog';

  let foot = '<button class="btn primary sm" data-action="open-chat" data-id="'+a.id+'">'+
    '<span class="ico" data-ico="chat"></span>Открыть чат</button>';

  if(isCatalog){
    if(owned){
      foot += '<span class="tag ok">Мой</span>';
    } else {
      foot += '<button class="btn sm" data-action="clone-agent" data-id="'+a.id+'">'+
        '<span class="ico" data-ico="plus"></span>Клонировать</button>';
    }
  } else if(owned){
    foot +=
      '<button class="icon-btn" data-action="edit-agent" data-id="'+a.id+'" title="Редактировать"><span class="ico" data-ico="edit"></span></button>'+
      '<button class="icon-btn" data-action="share-agent" data-id="'+a.id+'" title="Поделиться"><span class="ico" data-ico="users"></span></button>'+
      '<button class="icon-btn bad" data-action="del-agent" data-id="'+a.id+'" title="Удалить"><span class="ico" data-ico="trash"></span></button>';
  } else if(shared){
    foot +=
      '<button class="btn sm" data-action="clone-agent" data-id="'+a.id+'"><span class="ico" data-ico="plus"></span>Клонировать</button>'+
      '<button class="icon-btn bad" data-action="remove-shared" data-id="'+a.id+'" title="Убрать у меня"><span class="ico" data-ico="x"></span></button>';
  } else {
    foot += '<button class="btn sm" data-action="clone-agent" data-id="'+a.id+'">'+
      '<span class="ico" data-ico="plus"></span>Клонировать</button>';
  }

  const tags=[];
  if(shared) tags.push('<span class="tag warn">Поделились</span>');
  if(!a.is_owner && a.can_edit) tags.push('<span class="tag warn">Чужой</span>');
  if(a.is_public) tags.push('<span class="tag">В каталоге</span>');
  if(a.is_owner) tags.push('<span class="tag ok">Мой агент</span>');
  
  const ownerLine = a.owner_name
    ? '<small class="muted">Владелец: '+esc(a.owner_name)+(owned?' ':'')+'</small>'
    : '';

  return '<article class="card"><div class="card-top">'+tile(a)+
    '<div><h3>'+esc(a.name)+'</h3>'+tags.join(' ')+'</div></div>'+
    '<p>'+esc(a.description||'Без описания')+'</p>'+
    (a.document_count?'<p><small>Документов: '+a.document_count+'</small></p>':'')+
    ownerLine+
    '<div class="card-foot">'+foot+'</div></article>';
}

function renderOverview(){
  const rec=recentAgents(4);
  document.getElementById('view-overview').innerHTML=
  '<div class="page-head"><div><p class="eyebrow">Рабочее пространство</p><h1>Добрый день</h1>'+
  '<p>Выбирайте агентов, создавайте своих, прикрепляйте документы и делитесь с коллегами.</p></div></div>'+
  '<div class="stats">'+
    '<div class="stat"><b>'+S.agents.filter(a=>a.is_owner).length+'</b><span>Мои агенты</span></div>'+
    '<div class="stat"><b>'+S.docsCount+'</b><span>Документы</span></div>'+
    '<div class="stat"><b>'+S.catalog.length+'</b><span>В каталоге</span></div>'+
  '</div>'+
  '<div class="actions">'+
    '<button class="btn primary" data-action="new-agent"><span class="ico" data-ico="plus"></span>Создать агента</button>'+
    '<a class="btn" href="#/catalog"><span class="ico" data-ico="grid"></span>Открыть каталог</a>'+
  '</div>'+
  '<div class="section-title"><h2>Недавно использованные</h2><a class="link" href="#/history">Вся история</a></div>'+
  (rec.length?'<div class="grid">'+rec.map(r=>'<a class="card" href="#/chat/'+r.a.id+'"><div class="card-top">'+tile(r.a)+
    '<div><h3>'+esc(r.a.name)+'</h3><small class="muted">'+fmtTime(r.u)+'</small></div></div><p>'+esc(r.a.description||'')+'</p></a>').join('')+'</div>':
   emptyBox('chat','Пока нет разговоров','Откройте любого агента из каталога, чтобы начать.',
     '<div class="actions" style="justify-content:center"><a class="btn primary" href="#/catalog">Открыть каталог</a><button class="btn" data-action="new-agent">Создать агента</button></div>'));
}

function catalogItems(){
  const q=S.ui.catQ.trim().toLowerCase();
  return S.catalog.filter(a=>!q||(a.name+' '+(a.description||'')).toLowerCase().includes(q));
}
function renderCatalogGrid(){
  const it=catalogItems(),el=document.getElementById('catGrid');
  el.innerHTML = it.length
    ? it.map(a=>agentCard(a,'catalog')).join('')
    : '<div style="grid-column:1/-1">'+emptyBox('grid','В каталоге пока пусто',

function renderAgents(){

        '<div class="actions" style="justify-content:center;margin-top:12px">'+

  document.getElementById('view-agents').innerHTML = html;

function histItems(){

<script>
/* Раздел «Документы» */

function docStatusTag(d){
  const s=(d.status||'').toLowerCase();
  if(s==='uploaded')   return '<span class="tag ok">Загружен</span>';
  if(s==='processing') return '<span class="tag warn">Обработка</span>';
  if(s==='ready')      return '<span class="tag ok">Готов</span>';
  if(s==='failed')     return '<span class="tag warn">Ошибка</span>';
  return '<span class="tag">'+esc(d.status||'')+'</span>';
}

async function renderDocList(){
  const el=document.getElementById('docList');
  if(!el)return;
  el.innerHTML='<p class="muted" style="padding:8px 4px">Загрузка…</p>';

  const qs=new URLSearchParams();
  if(S.ui.docQ) qs.set('q',S.ui.docQ);
  if(S.ui.docExt) qs.set('ext',S.ui.docExt);
  qs.set('limit','500');

  try{
    const data=await apiFetch('/api/v1/documents?'+qs.toString());
    S.docs=data.items; S.docsCount=data.total;

    el.innerHTML = data.items.length
      ? '<div class="list">'+data.items.map(d=>{
          const ext=(d.filename.split('.').pop()||'').toLowerCase();
          return '<div class="row">'+
            '<span class="ext '+esc(ext)+'">'+ext.toUpperCase()+'</span>'+
            '<div class="row-main">'+
              '<b title="'+esc(d.filename)+'">'+esc(d.filename)+'</b>'+
              '<small>Загрузил: '+esc(d.uploaded_by.name)+ (S.me && d.uploaded_by.id !== S.me.id ? ' · <span class="tag warn" style="font-size:11px">чужой</span>' : '')+' · '+fmtTime(new Date(d.created_at).getTime())+'</small>'+
            '</div>'+
            '<span class="row-meta">'+fmtSize(d.file_size)+'</span>'+
            docStatusTag(d)+
            (d.can_delete?'<button class="icon-btn bad" data-action="del-doc" data-id="'+d.id+'" aria-label="Удалить"><span class="ico" data-ico="trash"></span></button>':'')+
          '</div>';
        }).join('')+'</div>'
      : emptyBox('doc','Документов нет','Загрузите PDF или DOCX — они появятся здесь.');

    hydrateIcons(el);
    buildNav('docs');
  }catch(e){
    el.innerHTML=emptyBox('info','Не удалось загрузить',e.message);
    hydrateIcons(el);
  }
}

function renderDocs(){
  document.getElementById('view-docs').innerHTML=
    '<div class="page-head"><div>'+
      '<p class="eyebrow">Документы</p><h1>Документация</h1>'+
      '<p>Загружайте PDF и DOCX. Администратор видит все файлы; пользователь — только свои.</p>'+
    '</div></div>'+
    '<div class="docs-layout">'+
      '<div class="panel">'+
        '<label class="drop" id="dropZone" for="fileInput">'+
          '<span class="ico" data-ico="upload"></span>'+
          '<b>Перетащите файлы сюда</b>'+
          '<small>PDF, DOCX · до '+MAX_FILE_MB+' МБ</small>'+
          '<span class="btn sm">Выбрать файлы</span>'+
        '</label>'+
        '<input type="file" id="fileInput" multiple accept=".pdf,.docx" hidden>'+
        '<p class="hint muted" id="uploadStatus"></p>'+
      '</div>'+
      '<div>'+
        '<div class="toolbar">'+
          '<div class="search"><span class="ico" data-ico="search"></span>'+
          '<input type="search" id="docSearch" placeholder="Поиск по имени файла" aria-label="Поиск документов" value="'+esc(S.ui.docQ)+'"></div>'+
          '<div class="chips" role="group" aria-label="Расширение">'+
            ['Все','PDF','DOCX'].map(x=>{
              const v=x==='Все'?'':x.toLowerCase();
              const on=(S.ui.docExt||'')===v;
              return '<button class="chip" data-action="docext" data-ext="'+v+'" aria-pressed="'+on+'">'+x+'</button>';
            }).join('')+
          '</div>'+
        '</div>'+
        '<div id="docList"></div>'+
      '</div>'+
    '</div>';

  hydrateIcons(document.getElementById('view-docs'));
  bindDocs();
  renderDocList();
}

function bindDocs(){
  const dz=document.getElementById('dropZone');
  const fi=document.getElementById('fileInput');
  if(dz&&fi){
    fi.onchange=()=>{addFiles(fi.files);fi.value='';};
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over');}));
    dz.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});
  }
  const ds=document.getElementById('docSearch');
  if(ds) ds.oninput=e=>{S.ui.docQ=e.target.value;renderDocList();};
}

async function addFiles(files){
  const list=Array.from(files);
  if(!list.length)return;
  const st=document.getElementById('uploadStatus');
  let ok=0;const bad=[];

  for(let i=0;i<list.length;i++){
    const f=list[i];
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(ext!=='pdf'&&ext!=='docx'){bad.push('«'+f.name+'»: только PDF и DOCX');continue;}
    if(f.size>MAX_FILE_MB*1048576){bad.push('«'+f.name+'»: больше '+MAX_FILE_MB+' МБ');continue;}

    if(st) st.textContent='Загрузка '+(i+1)+' из '+list.length+': '+f.name+'…';
    const fd=new FormData();fd.append('file',f);
    try{ await apiFetch('/api/v1/documents',{method:'POST',body:fd}); ok++; }
    catch(e){ bad.push('«'+f.name+'»: '+e.message); }
  }

  if(st) st.textContent='';
  if(ok){ toast('Загружено файлов: '+ok+'.'); await renderDocList(); }
  if(bad.length) toast('Не загружено: '+bad.join('; '),'error');
}

async function deleteDoc(id){
  const btn = document.querySelector('[data-action="del-doc"][data-id="'+id+'"]');
  const row = btn && btn.closest('.row');
  const name = (row && row.querySelector('b') && row.querySelector('b').textContent) || 'документ';

  const d = S.docs.find(x => String(x.id) === String(id));
  const foreign = d && S.me && d.uploaded_by.id !== S.me.id;
  const msg = foreign
    ? 'Файл «'+name+'» принадлежит другому пользователю. Удаление необратимо.'
    : '«'+name+'» будет удалён с сервера без возможности восстановления.';

  if(!(await confirmDlg('Удалить файл?', msg))) return;
  try{
    await apiFetch('/api/v1/documents/'+id, {method:'DELETE'});
    toast('Файл удалён.');
    await renderDocList();
  }catch(e){ toast('Не удалось удалить: ' + e.message, 'error'); }
}
</script>
<script>
/* Окно чата */
let chatId=null,busy=false;

function msgHtml(m,a){
  const u=m.role==='user';
  return '<div class="msg '+(u?'user':'agent')+'">'+(u?'':tile(a))+
    '<div><div class="bubble">'+esc(m.text).replace(/\n/g,'<br>')+'</div><time>'+fmtTime(m.ts)+'</time></div></div>';
}

function renderChat(id){
  const a=getAgent(id);
  const v=document.getElementById('view-chat');
  if(!a){location.hash='#/catalog';return;}
  chatId=id;busy=false;
  const conv=S.convs[id];
  const msgs=conv?conv.messages:[];
  const owned=a.is_owner||a.can_edit;

  const docs=a.documents||[];
  const enabled=docs.filter(d=>d.is_enabled);
  const disabled=docs.filter(d=>!d.is_enabled);

  const docsBlock = docs.length
    ? '<details class="agent-docs">'+
        '<summary><span class="ico" data-ico="doc"></span>'+
          'Документы агента ('+enabled.length+')'+
          (disabled.length?' · отключено '+disabled.length:'')+
        '</summary>'+
        '<ul>'+
          enabled.map(d=>{
            const ext=(d.filename.split('.').pop()||'').toLowerCase();
            return '<li>'+
              '<span class="ext '+esc(ext)+'">'+ext.toUpperCase()+'</span>'+
              '<span class="doc-name">'+esc(d.filename)+'</span>'+
              '<span class="muted">'+fmtSize(d.file_size)+'</span>'+
            '</li>';
          }).join('')+
          disabled.map(d=>{
            const ext=(d.filename.split('.').pop()||'').toLowerCase();
            return '<li class="disabled">'+
              '<span class="ext '+esc(ext)+'">'+ext.toUpperCase()+'</span>'+
              '<span class="doc-name">'+esc(d.filename)+'</span>'+
              '<span class="muted">отключён</span>'+
            '</li>';
          }).join('')+
        '</ul>'+
      '</details>'
    : '';

  v.innerHTML=
  '<header class="chat-head">'+
    '<button class="icon-btn" data-action="chat-back" aria-label="Назад"><span class="ico" data-ico="back"></span></button>'+
    tile(a)+
    '<div class="grow"><h1>'+esc(a.name)+'</h1>'+
      '<small><span class="dot"></span>'+(owned?'Мой агент':'Поделились'+(a.owner_name?' · '+esc(a.owner_name):''))+'</small></div>'+
    (owned?'<button class="icon-btn" data-action="edit-agent" data-id="'+id+'" aria-label="Редактировать"><span class="ico" data-ico="edit"></span></button>':'')+
    '<button class="icon-btn" data-action="clear-chat" aria-label="Очистить чат" title="Очистить чат"><span class="ico" data-ico="broom"></span></button>'+
  '</header>'+
  '<div class="chat-body" id="chatBody"><div class="chat-col" id="chatCol">'+
    '<div class="welcome">'+tile(a,true)+'<h2>'+esc(a.name)+'</h2>'+
      '<p>'+esc(a.description||'Задайте вопрос, и агент ответит в рамках своих инструкций.')+'</p>'+
      docsBlock+
      '<div class="chips">'+
        ['Чем ты можешь помочь?','Кратко опиши свои возможности','Как лучше формулировать запросы?'].map(t=>
          '<button class="chip" data-action="tip" data-t="'+esc(t)+'">'+esc(t)+'</button>').join('')+
      '</div>'+
    '</div>'+
    '<div id="chatMsgs" style="display:contents">'+msgs.map(m=>msgHtml(m,a)).join('')+'</div>'+
  '</div></div>'+
  '<form class="composer" id="chatForm">'+
    '<div class="composer-in">'+
      '<textarea id="chatInput" rows="1" placeholder="Напишите сообщение…" aria-label="Сообщение агенту"></textarea>'+
      '<button class="send" id="sendBtn" type="submit" aria-label="Отправить" disabled><span class="ico" data-ico="send"></span></button>'+
    '</div>'+
    '<small>Enter — отправить, Shift+Enter — новая строка.</small>'+
  '</form>';

  const inp=document.getElementById('chatInput'),btn=document.getElementById('sendBtn');
  inp.addEventListener('input',()=>{
    inp.style.height='auto';
    inp.style.height=Math.min(inp.scrollHeight,160)+'px';
    btn.disabled=busy||!inp.value.trim();
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
      e.preventDefault();
      document.getElementById('chatForm').requestSubmit();
    }
  });
  document.getElementById('chatForm').addEventListener('submit',e=>{e.preventDefault();sendMsg(inp.value);});
  scrollChat();
  hydrateIcons(v);
}
function scrollChat(){const b=document.getElementById('chatBody');if(b)b.scrollTop=b.scrollHeight;}

async function sendMsg(raw){
  const text=(raw||'').trim();
  if(!text||busy||!chatId)return;
  const a=getAgent(chatId),id=chatId;
  if(!a)return;
  const conv=S.convs[id]||(S.convs[id]={updated:Date.now(),messages:[]});
  const um={role:'user',text,ts:Date.now()};
  conv.messages.push(um);conv.updated=um.ts;save('convs');

  const box=document.getElementById('chatMsgs'),inp=document.getElementById('chatInput');
  box.insertAdjacentHTML('beforeend',msgHtml(um,a));
  inp.value='';inp.style.height='auto';busy=true;
  document.getElementById('sendBtn').disabled=true;
  box.insertAdjacentHTML('beforeend',
    '<div class="msg agent typing" id="typing" aria-label="Агент печатает">'+tile(a)+
    '<div class="bubble"><i></i><i></i><i></i></div></div>');
  scrollChat();

  let answer;
  try{
    const r=await fetch('/api/v1/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ message:text, system_prompt:a.system_prompt||null })
    });
    const j=await r.json().catch(()=>null);
    if(!r.ok){
      const det=j&&(typeof j.detail==='string'?j.detail:(j.detail&&(j.detail.message||JSON.stringify(j.detail)))||j.message);
      throw new Error(det||('Ошибка '+r.status));
    }
    answer=(j&&j.answer)?j.answer:'(пустой ответ модели)';
  }catch(err){
    answer='Не удалось получить ответ от модели: '+(err&&err.message?err.message:err);
  }

  const am={role:'agent',text:answer,ts:Date.now()};
  conv.messages.push(am);conv.updated=am.ts;save('convs');

  if(chatId===id){
    const ty=document.getElementById('typing');if(ty)ty.remove();
    document.getElementById('chatMsgs').insertAdjacentHTML('beforeend',msgHtml(am,a));
    busy=false;
    const i=document.getElementById('chatInput');
    document.getElementById('sendBtn').disabled=!i.value.trim();
    scrollChat();
  }
}

async function clearChat(){
  if(!chatId||!S.convs[chatId])return toast('Чат уже пуст.');
  if(!(await confirmDlg('Очистить чат?','Сообщения этого разговора будут удалены локально.','Очистить')))return;
  delete S.convs[chatId];save('convs');renderChat(chatId);toast('Чат очищен.');
}
</script>
<script>
/* Маршрутизация, форма агента, share-диалог, делегирование событий */
const NAV=[['overview','Обзор','home'],['catalog','Каталог','grid'],['agents','Мои агенты','users'],['docs','Документы','doc'],['history','История','clock']];
const TAB=[['overview','Обзор','home'],['agents','Агенты','users'],['catalog','Каталог','grid'],['docs','Документы','doc'],['history','История','clock']];
const ROUTES={overview:renderOverview,catalog:renderCatalog,agents:renderAgents,docs:renderDocs,history:renderHistory,settings:renderSettings};

function hydrateIcons(root){(root||document).querySelectorAll('[data-ico]').forEach(el=>{if(!el.firstChild)el.innerHTML=icon(el.dataset.ico);});}

function currentSection(){
  const h=(location.hash||'#/overview').replace(/^#\/?/,'').split('/');
  const name=h[0]||'overview';
  return name==='chat'?(isMine(h[1])?'agents':'catalog'):name;
}

function buildNav(cur){
  document.getElementById('sideNav').innerHTML=NAV.map(n=>
    '<a class="nav-item'+(cur===n[0]?' active':'')+'" href="#/'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'>'+
    '<span class="ico">'+icon(n[2])+'</span><span>'+n[1]+'</span>'+
    (n[0]==='agents'?'<span class="count">'+S.agents.filter(a=>a.is_owner).length+'</span>':
     n[0]==='docs'?'<span class="count">'+S.docsCount+'</span>':
     n[0]==='catalog'?'<span class="count">'+S.catalog.length+'</span>':'')+
    '</a>').join('');
  document.getElementById('tabBar').innerHTML=TAB.map(n=>
    '<a href="#/'+n[0]+'"'+(cur===n[0]?' class="active" aria-current="page"':'')+'>'+
    '<span class="ico">'+icon(n[2])+'</span>'+n[1]+'</a>').join('');
  const st=document.querySelector('[data-nav=settings]');
  if(st) st.classList.toggle('active',cur==='settings');
}

async function route(){
  const h=(location.hash||'#/overview').replace(/^#\/?/,'').split('/');
  let name=h[0]||'overview',arg=h[1];
  if(name==='chat'&&!arg)name='overview';
  if(name!=='chat'&&!ROUTES[name])name='overview';

  document.querySelectorAll('[data-view]').forEach(v=>v.hidden=v.dataset.view!==(name==='chat'?'chat':name));
  document.body.classList.toggle('in-chat',name==='chat');

  if(name==='chat'){
    const a=getAgent(arg);
    if(!a){location.hash='#/overview';return;}
    renderChat(arg);
    document.title=a.name+' — Мнемозина';
  } else {
    ROUTES[name]();
    document.title='Мнемозина';
  }
  buildNav(name==='chat'?(isMine(arg)?'agents':'catalog'):name);
  const view=document.querySelector('[data-view]:not([hidden])');
  hydrateIcons(view);hydrateIcons(document.querySelector('.sidebar'));
  if(name!=='chat')window.scrollTo(0,0);
}

/* ============ комбобокс документов в форме агента ============ */
const pickerState = { attached: [], mine: [], checked: new Set() };

function docOwnerId(d){
  return d.owner_id ?? (d.uploaded_by ? d.uploaded_by.id : null);
}
function docOwnerName(d){
  return d.owner_name ?? (d.uploaded_by ? d.uploaded_by.name : null);
}

function docRow(d, kind){
  const checked = pickerState.checked.has(d.id) ? ' checked' : '';
  const meId = S.me ? Number(S.me.id) : null;
  const ownerId = docOwnerId(d);
  const isForeignOwner = meId !== null && ownerId !== null
    && Number(ownerId) !== meId;

  const ownerTag = (isForeignOwner && docOwnerName(d))
    ? '<small class="muted">от ' + esc(docOwnerName(d)) + '</small>' : '';
  const sizeTag = (!isForeignOwner && d.file_size)
    ? '<small class="muted">' + fmtSize(d.file_size) + '</small>' : '';

  return '<label class="doc-check">' +
    '<input type="checkbox" data-doc="' + kind + '" value="' + d.id + '"' + checked + '> ' +
    '<span class="doc-check-name">' + esc(d.filename) + '</span>' +
    ownerTag + sizeTag +
  '</label>';
}

function renderDocsPicker(){
  const box = document.getElementById('fDocsList');
  const count = document.getElementById('fDocsCount');
  if(!box) return;

  const q = ((document.getElementById('fDocsSearch')?.value) || '').trim().toLowerCase();
  const attached = pickerState.attached;
  const mine = pickerState.mine.filter(d => !q || d.filename.toLowerCase().includes(q));

  if(count){
    count.textContent = pickerState.checked.size
      ? 'Выбрано: ' + pickerState.checked.size
      : '';
  }

  if(!attached.length && !mine.length){
    box.innerHTML = '<p class="picker-empty">' +
      (q ? 'Ничего не найдено.'
         : (pickerState.mine.length === 0
            ? 'Сначала загрузите документы в разделе «Документы».'
            : 'Нет доступных документов.')) +
      '</p>';
    return;
  }

  let html = '';
  if(attached.length){
    html += '<div class="doc-group-label">Унаследованные (от клонирования)</div>';
    html += attached.map(d => docRow(d, 'attached')).join('');
  }
  if(mine.length){
    html += '<div class="doc-group-label">Мои документы</div>';
    html += mine.map(d => docRow(d, 'mine')).join('');
  }
  box.innerHTML = html;
}

function openDocsPicker(){ const d=document.getElementById('fDocsList'); if(d)d.hidden=false; }
function closeDocsPicker(){ const d=document.getElementById('fDocsList'); if(d)d.hidden=true; }

/* форма агента */
async function openAgentForm(id,preset){
  await loadDocs();
  const a=id?S.agents.find(x=>String(x.id)===String(id)):null;
  const d=a||preset||{name:'',description:'',system_prompt:'',icon:'bot',color:AGENT_COLORS[0][0],document_ids:[]};

  document.getElementById('agentDlgTitle').textContent=a?'Редактирование агента':'Новый агент';
  document.getElementById('fId').value=a?a.id:'';
  document.getElementById('fName').value=d.name||'';
  document.getElementById('fDesc').value=d.description||'';
  document.getElementById('fInstr').value=d.system_prompt||'';
  document.getElementById('fCount').textContent=(d.system_prompt||'').length;
  document.getElementById('fName').closest('.field').classList.remove('invalid');
  document.getElementById('fNameErr').hidden=true;

  document.getElementById('iconPicker').innerHTML=AGENT_ICONS.map(i=>
    '<label><input type="radio" name="ic" value="'+i+'"'+(i===d.icon?' checked':'')+' aria-label="Иконка '+i+'"><span class="opt">'+icon(i)+'</span></label>').join('');
  document.getElementById('colorPicker').innerHTML=AGENT_COLORS.map(c=>
    '<label><input type="radio" name="cl" value="'+c[0]+'"'+(c[0]===d.color?' checked':'')+' aria-label="'+c[1]+'"><span class="sw" style="--c:'+c[0]+'"></span></label>').join('');

  const allDocs = (a && a.documents) || [];
  pickerState.attached = allDocs.filter(x => x.is_inherited);

  const ownIds = new Set(S.docs.map(d => d.id));
  const extraMine = allDocs.filter(d => !d.is_inherited && !ownIds.has(d.id));
  pickerState.mine = S.docs.concat(extraMine);

  pickerState.checked = new Set(allDocs.filter(x => x.is_enabled).map(x => x.id));

  const searchBox = document.getElementById('fDocsSearch');
  if(searchBox) searchBox.value = '';
  closeDocsPicker();
  renderDocsPicker();

  const sv=document.getElementById('fSave');
  sv.disabled=false;sv.textContent='Сохранить';
  document.getElementById('agentDlg').showModal();
  setTimeout(()=>document.getElementById('fName').focus(),30);
}

async function submitAgent(e){
  e.preventDefault();
  const name=document.getElementById('fName').value.trim();
  const f=document.getElementById('fName').closest('.field');
  if(!name){f.classList.add('invalid');document.getElementById('fNameErr').hidden=false;document.getElementById('fName').focus();toast('Укажите название.','error');return;}
  f.classList.remove('invalid');document.getElementById('fNameErr').hidden=true;

  const sv=document.getElementById('fSave');
  sv.disabled=true;sv.textContent='Сохранение…';
  const id=document.getElementById('fId').value;
  const payload={
    name,
    description:document.getElementById('fDesc').value.trim()||null,
    system_prompt:document.getElementById('fInstr').value.trim(),
    model_name:'qwen',
    icon:(document.querySelector('[name=ic]:checked')||{}).value||'bot',
    color:(document.querySelector('[name=cl]:checked')||{}).value||AGENT_COLORS[0][0],
    document_ids: Array.from(pickerState.checked)
  };

  try{
    if(id){
      await apiFetch('/api/v1/agents/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    } else {
      await apiFetch('/api/v1/agents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    }
    document.getElementById('agentDlg').close();
    toast(id?'Изменения сохранены.':'Агент создан.');
    await loadAgents();
    route();
  }catch(err){
    sv.disabled=false;sv.textContent='Сохранить';
    toast('Ошибка: '+err.message,'error');
  }
}

async function deleteAgent(id){
  const a=S.agents.find(x=>String(x.id)===String(id));
  if(!a)return;
  if(!(await confirmDlg('Удалить агента?','«'+a.name+'» будет удалён.')))return;
  try{
    await apiFetch('/api/v1/agents/'+id,{method:'DELETE'});
    toast('Агент удалён.');
    await loadAgents();
    await loadCatalog();
    buildNav(currentSection());
    route();
  }catch(e){ toast('Не удалось удалить: '+e.message,'error'); }
}

async function cloneAgent(id){
  try{
    await apiFetch('/api/v1/agents/'+id+'/clone',{method:'POST'});
    toast('Агент склонирован.');
    await loadAgents();
    await loadCatalog();
    await loadDocs();
    location.hash='#/agents';
  }catch(e){ toast('Не удалось клонировать: '+e.message,'error'); }
}

async function removeSharedAgent(id){
  const a=S.agents.find(x=>String(x.id)===String(id));
  if(!a)return;
  if(!(await confirmDlg('Убрать агента?','«'+a.name+'» больше не будет отображаться у вас в списке.','Убрать')))return;
  try{
    await apiFetch('/api/v1/agents/'+id+'/shared-with-me',{method:'DELETE'});
    toast('Агент убран из вашего списка.');
    await loadAgents();
    route();
  }catch(e){ toast('Ошибка: '+e.message,'error'); }
}

/* ============ «Поделиться» — диалог ============ */
/* ============ «Поделиться» — диалог ============ */
const shareState = {
  agentId: null,
  agentName: '',
  originalPublic: false,
  pendingPublic: false,
  originalSharedIds: new Set(),
  pendingSharedIds: new Set(),
  users: [],
};

function renderShareUserDrop(){
  const drop = document.getElementById('shareUserDrop');
  const count = document.getElementById('shareUserCount');
  if(!drop) return;

  const q = ((document.getElementById('shareUserSearch')?.value) || '').trim().toLowerCase();
  const list = shareState.users.filter(u => !q || (u.name || '').toLowerCase().includes(q));

  if(count){
    count.textContent = shareState.pendingSharedIds.size
      ? 'Выбрано: ' + shareState.pendingSharedIds.size
      : '';
  }

  if(!shareState.users.length){
    drop.innerHTML = '<p class="picker-empty">Нет других пользователей.</p>';
    return;
  }
  if(!list.length){
    drop.innerHTML = '<p class="picker-empty">Ничего не найдено.</p>';
    return;
  }

  drop.innerHTML = list.map(u =>
    '<label class="doc-check">' +
      '<input type="checkbox" data-uid="' + u.id + '"' +
        (shareState.pendingSharedIds.has(Number(u.id)) ? ' checked' : '') + '> ' +
      '<span class="doc-check-name">' + esc(u.name) + '</span>' +
      '<small class="muted">' + esc(u.role) + '</small>' +
    '</label>'
  ).join('');

  // Меняем только локальное состояние. На сервер уйдёт по «Готово».
  drop.querySelectorAll('input[type=checkbox][data-uid]').forEach(cb => {
    cb.onchange = () => {
      const uid = parseInt(cb.dataset.uid, 10);
      if(!Number.isFinite(uid)) return;
      if(cb.checked) shareState.pendingSharedIds.add(uid);
      else           shareState.pendingSharedIds.delete(uid);
      if(count){
        count.textContent = shareState.pendingSharedIds.size
          ? 'Выбрано: ' + shareState.pendingSharedIds.size
          : '';
      }
    };
  });
}

function openShareUserDrop(){ const d=document.getElementById('shareUserDrop'); if(d)d.hidden=false; }
function closeShareUserDrop(){ const d=document.getElementById('shareUserDrop'); if(d)d.hidden=true; }

async function openShareDlg(id){
  const a = S.agents.find(x => String(x.id) === String(id));
  if(!a) return;

  let users = [];
  try{ users = await apiFetch('/api/v1/users?role=user'); }
  catch(e){ return toast('Не удалось получить пользователей: ' + e.message, 'error'); }

  shareState.agentId = id;
  shareState.agentName = a.name;
  shareState.originalPublic = !!a.is_public;
  shareState.pendingPublic = shareState.originalPublic;
  shareState.originalSharedIds = new Set((a.share_user_ids || []).map(Number));
  shareState.pendingSharedIds = new Set(shareState.originalSharedIds);
  shareState.users = users.filter(u =>Number(u.id) !== Number(a.created_by) && u.role !== 'admin');
  const sb = document.getElementById('shareUserSearch');
  if(sb) sb.value = '';
  const pub = document.getElementById('sharePublic');
  if(pub) pub.checked = shareState.pendingPublic;

  const t = document.getElementById('shareDlgTitle');
  if(t) t.textContent = 'Поделиться: ' + shareState.agentName;

  closeShareUserDrop();
  renderShareUserDrop();
  document.getElementById('shareDlg').showModal();
}

async function applyShare(){
  const id = shareState.agentId;
  if(!id) return;

  const publicChanged = shareState.pendingPublic !== shareState.originalPublic;
  const toAdd = [...shareState.pendingSharedIds].filter(x => !shareState.originalSharedIds.has(x));
  const toRemove = [...shareState.originalSharedIds].filter(x => !shareState.pendingSharedIds.has(x));

  try{
    if(publicChanged){
      if(shareState.pendingPublic)
        await apiFetch('/api/v1/agents/' + id + '/publish', {method:'POST'});
      else
        await apiFetch('/api/v1/agents/' + id + '/publish', {method:'DELETE'});
    }

    for(const uid of toAdd){
      await apiFetch('/api/v1/agents/' + id + '/share', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({user_id: uid}),
      });
    }
    for(const uid of toRemove){
      await apiFetch('/api/v1/agents/' + id + '/share/' + uid, {method:'DELETE'});
    }

    if(publicChanged || toAdd.length || toRemove.length){
      await loadAgents();
      await loadCatalog();
      buildNav(currentSection());
      toast('Изменения сохранены.');
    }
  }catch(e){
    toast('Ошибка: ' + e.message, 'error');
  }finally{
    document.getElementById('shareDlg').close();
  }
}

/* ============ Делегирование кликов ============ */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-action]');if(!t)return;
  const id=t.dataset.id;
  switch(t.dataset.action){
    case 'new-agent': await openAgentForm(); break;
    case 'close-agent': document.getElementById('agentDlg').close(); break;
    case 'edit-agent': await openAgentForm(id); break;
    case 'del-agent': await deleteAgent(id); break;
    case 'open-chat': location.hash='#/chat/'+id; break;
    case 'clone-agent': await cloneAgent(id); break;
    case 'share-agent': await openShareDlg(id); break;
    case 'remove-shared': await removeSharedAgent(id); break;
    case 'apply-share': await applyShare(); break;
    case 'close-share': document.getElementById('shareDlg').close(); break;
    case 'del-doc': await deleteDoc(id); break;
    case 'docext': S.ui.docExt=t.dataset.ext||''; renderDocs(); break;
    case 'chat-back': history.length>1?history.back():(location.hash='#/overview'); break;
    case 'tip': sendMsg(t.dataset.t); break;
    case 'clear-chat': clearChat(); break;
    case 'reset-demo':
      if(await confirmDlg('Сбросить историю чатов?','Все локальные чаты вернутся к пустому состоянию.','Сбросить')){
        S.convs={};save('convs');toast('История чатов очищена.');route();
      }
      break;
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='catSearch'){S.ui.catQ=e.target.value;renderCatalogGrid();}
  else if(e.target.id==='histSearch'){S.ui.histQ=e.target.value;renderHistList();}
  else if(e.target.id==='fInstr'){document.getElementById('fCount').textContent=e.target.value.length;}
  else if(e.target.id==='fName'&&e.target.value.trim()){e.target.closest('.field').classList.remove('invalid');document.getElementById('fNameErr').hidden=true;}
});

/* ============ комбобокс документов — обработчики ============ */
document.getElementById('fDocsSearch')?.addEventListener('focus', openDocsPicker);
document.getElementById('fDocsSearch')?.addEventListener('click', openDocsPicker);
document.getElementById('fDocsSearch')?.addEventListener('input', () => { openDocsPicker(); renderDocsPicker(); });

document.addEventListener('click', e => {

});

document.getElementById('fDocsList')?.addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox][data-doc]');
  if(!cb) return;

  if(cb.checked) pickerState.checked.add(id);
  else           pickerState.checked.delete(id);

  if(count){
    count.textContent = pickerState.checked.size
      ? 'Выбрано: ' + pickerState.checked.size
      : '';
  }
});

/* ============ share: тумблер публикации (локально) ============ */
document.getElementById('sharePublic')?.addEventListener('change', e => {
  shareState.pendingPublic = e.target.checked;
});

/* ============ share: комбобокс пользователей ============ */
document.getElementById('shareUserSearch')?.addEventListener('focus', openShareUserDrop);
document.getElementById('shareUserSearch')?.addEventListener('click', openShareUserDrop);
document.getElementById('shareUserSearch')?.addEventListener('input', () => {
  openShareUserDrop();
  renderShareUserDrop();
});

document.addEventListener('click', e => {
  const combo = document.getElementById('shareUserCombo');
  if(combo && !combo.contains(e.target)) closeShareUserDrop();

/* ============ старт ============ */
document.getElementById('agentForm').addEventListener('submit',submitAgent);

let appReady = false;
window.addEventListener('hashchange', () => { if(appReady) route(); });

hydrateIcons(document);

(async () => {
  await Promise.all([loadMe(), loadAgents(), loadCatalog(), loadDocs()]);
  appReady = true;
  await route();
