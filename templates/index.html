/me').then(function(j){member=j.member;return member}).catch(function(){return null})},visitor:vid};})()</script><link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" type="image/x-icon"><style>[hidden]:not([hidden="until-found"]){display:none!important}</style>

<script>
/* Состояние + локальное хранение (в песочнице может не сохраняться между перезагрузками) */
const Store={
  mem:{},
  get(k,d){
    try{const v=localStorage.getItem('agt:'+k);if(v!==null)return JSON.parse(v);}catch(e){}
    return (k in this.mem)?this.mem[k]:d;
  },
  set(k,v){this.mem[k]=v;try{localStorage.setItem('agt:'+k,JSON.stringify(v));}catch(e){}}
};
const now=Date.now(),H=3600e3,D=24*H;
function seedConvs(){
  const m=(r,t,ago)=>({role:r,text:t,ts:now-ago});
  return {
    'c-docs':{updated:now-2*H,messages:[m('user','Сделай краткую выжимку по договору',2*H+60e3),m('agent','Демонстрационный ответ: здесь появится выжимка по прикреплённым документам.',2*H)]},
    'c-py':{updated:now-D,messages:[m('user','Напиши Django-view для списка заказов',D+60e3),m('agent','Демонстрационный ответ: пример класса ListView с пагинацией и фильтрацией.',D)]},
    'c-edit':{updated:now-3*D,messages:[m('user','Сделай текст короче',3*D+60e3),m('agent','Демонстрационный ответ: сокращённая версия сохранит основную мысль.',3*D)]}
  };
}
const S={
  agents:Store.get('agents',[{id:'u-1',name:'Мой аналитик отчётов',desc:'Разбирает квартальные отчёты и готовит сводки для команды.',instr:'Отвечай кратко, используй списки и выделяй цифры.',icon:'chart',color:'#7c3aed'}]),
  docs:Store.get('docs',[
    {id:'d1',agentId:'u-1',name:'Отчёт_Q1.pdf',ext:'pdf',size:2411724,status:'demo'},
    {id:'d2',agentId:'u-1',name:'Метрики.csv',ext:'csv',size:48210,status:'demo'},
    {id:'d3',agentId:'c-docs',name:'Договор_поставки.docx',ext:'docx',size:187392,status:'demo'}
  ]),
  convs:Store.get('convs',seedConvs()),
  ui:{catQ:'',catCat:'Все',docQ:'',docAgent:'all',histQ:'',pending:[]}
};
function save(k){Store.set(k,S[k]);}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function allAgents(){return CATALOG.concat(S.agents);}
function getAgent(id){return allAgents().find(a=>a.id===id);}
function isMine(id){return S.agents.some(a=>a.id===id);}
function fmtSize(b){if(b<1024)return b+' Б';if(b<1048576)return (b/1024).toFixed(b<10240?1:0).replace('.',',')+' КБ';return (b/1048576).toFixed(1).replace('.',',')+' МБ';}
function fmtTime(ts){
  const d=new Date(ts),n=new Date();
  const hm=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===n.toDateString())return 'Сегодня, '+hm;
  const y=new Date(n-D);if(d.toDateString()===y.toDateString())return 'Вчера, '+hm;
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function docsOf(id){return S.docs.filter(d=>d.agentId===id);}
function recentAgents(n){
  return Object.keys(S.convs).map(id=>({a:getAgent(id),u:S.convs[id].updated})).filter(x=>x.a).sort((x,y)=>y.u-x.u).slice(0,n);
}
function tile(a,lg){return '<span class="tile'+(lg?' lg':'')+'" style="--c:'+esc(a.color)+'">'+icon(a.icon)+'</span>';}
let toastTimer;
function toast(text,type){
  const el=document.createElement('div');el.className='toast'+(type==='error'?' error':'');el.textContent=text;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.remove();},type==='error'?5000:3200);
}
function confirmDlg(title,text,yes){
  return new Promise(res=>{
    const d=document.getElementById('confirmDlg');
    document.getElementById('cTitle').textContent=title;
    document.getElementById('cText').textContent=text;
    document.getElementById('cYes').textContent=yes||'Удалить';
    d.returnValue='';
    d.onclose=()=>res(d.returnValue==='yes');
    d.showModal();
  });
}
</script>
<script>

    foot='<button class="btn primary sm" data-action="open-chat" data-id="'+a.id+'"><span class="ico" data-ico="chat"></span>Открыть чат</button>'+
    '<button class="icon-btn" data-action="edit-agent" data-id="'+a.id+'" aria-label="Редактировать «'+esc(a.name)+'»" title="Редактировать"><span class="ico" data-ico="edit"></span></button>'+
    '<button class="icon-btn bad" data-action="del-agent" data-id="'+a.id+'" aria-label="Удалить «'+esc(a.name)+'»" title="Удалить"><span class="ico" data-ico="trash"></span></button>';
  }else{

    '<button class="btn sm" data-action="clone-agent" data-id="'+a.id+'">Копировать в мои</button>';
  }
  const dn=docsOf(a.id).length;
  return '<article class="card"><div class="card-top">'+tile(a)+'<div><h3>'+esc(a.name)+'</h3>'+(a.cat?'<span class="tag">'+esc(a.cat)+'</span>':'<span class="tag ok">Мой агент</span>')+'</div></div>'+
   '<p>'+esc(a.desc||'Без описания')+'</p>'+(dn?'<p><small>Документов: '+dn+'</small></p>':'')+'<div class="card-foot">'+foot+'</div></article>';

<script>
/* Раздел «Документы» */
function docsItems(){

function statusTag(d){
  if(d.status==='picked')return '<span class="tag warn">Выбран · не загружен</span>';
  return '<span class="tag">Демо-запись</span>';
}
function renderDocList(){
  const it=docsItems(),el=document.getElementById('docList');

    const a=getAgent(d.agentId);
    return '<div class="row"><span class="ext '+d.ext+'">'+d.ext.toUpperCase()+'</span><div class="row-main"><b title="'+esc(d.name)+'">'+esc(d.name)+'</b><small>Агент: '+esc(a?a.name:'удалён')+'</small></div><span class="row-meta">'+fmtSize(d.size)+'</span>'+statusTag(d)+
    '<button class="icon-btn bad" data-action="del-doc" data-id="'+d.id+'" aria-label="Удалить файл '+esc(d.name)+'"><span class="ico" data-ico="trash"></span></button></div>';
  }).join('')+'</div>':emptyBox('doc','Документов нет','Выберите агента и добавьте файлы слева.');
  hydrateIcons(el);
}
function agentOptions(sel){
  return '<optgroup label="Мои агенты">'+(S.agents.map(a=>'<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.name)+'</option>').join('')||'<option disabled>Нет своих агентов</option>')+'</optgroup>'+
   '<optgroup label="Каталог">'+CATALOG.map(a=>'<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.name)+'</option>').join('')+'</optgroup>';
}
function renderDocs(){
  const sel=(S.ui.target&&getAgent(S.ui.target))?S.ui.target:(S.agents[0]||CATALOG[0]).id;
  document.getElementById('view-docs').innerHTML=
  '<div class="page-head"><div><p class="eyebrow">Документы</p><h1>Документация агентов</h1><p>Прикрепляйте файлы к конкретному агенту, чтобы он опирался на них в ответах.</p></div></div>'+
  '<div class="notice"><span class="ico" data-ico="info"></span><span><b>Прототип без сервера.</b> Файлы только выбираются в браузере — фактическая загрузка, хранение и обработка требуют подключения Django backend.</span></div>'+
  '<div class="docs-layout"><div class="panel"><div class="field" style="margin:0"><label for="docTarget">Агент для документов</label><select id="docTarget">'+agentOptions(sel)+'</select></div>'+
  '<label class="drop" id="dropZone" for="fileInput"><span class="ico" data-ico="upload"></span><b>Перетащите файлы сюда</b><small>PDF, DOCX, TXT, MD, CSV · до '+MAX_FILE_MB+' МБ</small><span class="btn sm">Выбрать файлы</span></label>'+
  '<input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt,.md,.csv" hidden>'+
  '<button class="btn" data-action="demo-doc"><span class="ico" data-ico="plus"></span>Добавить демо-документ</button></div>'+
  '<div><div class="toolbar"><div class="search"><span class="ico" data-ico="search"></span><input type="search" id="docSearch" placeholder="Поиск по имени файла" aria-label="Поиск документов" value="'+esc(S.ui.docQ)+'"></div>'+
  '<select id="docFilter" aria-label="Фильтр по агенту" style="width:auto;max-width:240px"><option value="all">Все агенты</option>'+agentOptions(S.ui.docAgent)+'</select></div><div id="docList"></div></div></div>';
  renderDocList();
  bindDocs();
}
function addFiles(files){
  const target=document.getElementById('docTarget').value;
  let ok=0,bad=[];
  Array.from(files).forEach(f=>{
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(!ALLOWED_EXT.includes(ext)){bad.push('«'+f.name+'» — формат .'+ext+' не поддерживается');return;}
    if(f.size>MAX_FILE_MB*1048576){bad.push('«'+f.name+'» — больше '+MAX_FILE_MB+' МБ');return;}
    S.docs.unshift({id:uid('d'),agentId:target,name:f.name,ext,size:f.size,status:'picked'});ok++;
  });
  if(ok){save('docs');renderDocList();toast('Файлов выбрано: '+ok+'. Загрузка на сервер в прототипе не выполняется.');}
  if(bad.length)toast('Не добавлено: '+bad.join('; ')+'. Допустимы PDF, DOCX, TXT, MD, CSV.','error');
}
function bindDocs(){
  const dz=document.getElementById('dropZone'),fi=document.getElementById('fileInput');
  fi.onchange=()=>{addFiles(fi.files);fi.value='';};
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over');}));
  dz.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});
  document.getElementById('docTarget').onchange=e=>{S.ui.target=e.target.value;};
  document.getElementById('docSearch').oninput=e=>{S.ui.docQ=e.target.value;renderDocList();};
  document.getElementById('docFilter').onchange=e=>{S.ui.docAgent=e.target.value;renderDocList();};
}
function addDemoDoc(){
  const target=document.getElementById('docTarget').value;
  const names=[['Регламент.pdf','pdf',913408],['Заметки.md','md',6420],['Инструкция.docx','docx',254976],['Данные.csv','csv',130112],['Черновик.txt','txt',18240]];
  const n=names[Math.floor(Math.random()*names.length)];
  S.docs.unshift({id:uid('d'),agentId:target,name:n[0],ext:n[1],size:n[2],status:'demo'});
  save('docs');renderDocList();toast('Демо-документ «'+n[0]+'» добавлен.');
}
</script>
<script>
/* Окно чата */
let chatId=null,busy=false;
function msgHtml(m,a){
  const u=m.role==='user';
  return '<div class="msg '+(u?'user':'agent')+'">'+(u?'':tile(a))+'<div><div class="bubble">'+esc(m.text).replace(/\n/g,'<br>')+'</div><time>'+fmtTime(m.ts)+'</time></div></div>';
}
function renderChat(id){
  const a=getAgent(id);
  const v=document.getElementById('view-chat');
  if(!a){location.hash='#/catalog';return;}
  chatId=id;busy=false;
  const conv=S.convs[id];
  const msgs=conv?conv.messages:[];
  v.innerHTML=
  '<header class="chat-head"><button class="icon-btn" data-action="chat-back" aria-label="Назад"><span class="ico" data-ico="back"></span></button>'+tile(a)+
  '<div class="grow"><h1>'+esc(a.name)+'</h1><small><span class="dot"></span>Демо-режим · ответы не настоящие</small></div>'+
  (isMine(id)?'<button class="icon-btn" data-action="edit-agent" data-id="'+id+'" aria-label="Редактировать агента"><span class="ico" data-ico="edit"></span></button>':'')+
  '<button class="icon-btn" data-action="clear-chat" aria-label="Очистить чат" title="Очистить чат"><span class="ico" data-ico="broom"></span></button></header>'+
  '<div class="chat-body" id="chatBody"><div class="chat-col" id="chatCol">'+
  '<div class="notice info"><span class="ico" data-ico="info"></span><span>Ответы здесь — заготовки. Для настоящих ответов нужно подключить API AI-агента на стороне Django.</span></div>'+
  '<div class="welcome">'+tile(a,true)+'<h2>'+esc(a.name)+'</h2><p>'+esc(a.greet||a.desc||'Задайте вопрос, и агент ответит в рамках своих инструкций.')+'</p>'+
  (docsOf(id).length?'<span class="tag ok">Прикреплено документов: '+docsOf(id).length+'</span>':'')+
  '<div class="chips">'+(a.tips||['Чем ты можешь помочь?','Расскажи о своих возможностях','Как лучше формулировать запросы?']).map(t=>'<button class="chip" data-action="tip" data-t="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div></div>'+
  '<div id="chatMsgs" style="display:contents">'+msgs.map(m=>msgHtml(m,a)).join('')+'</div></div></div>'+
  '<form class="composer" id="chatForm"><div class="composer-in"><textarea id="chatInput" rows="1" placeholder="Напишите сообщение…" aria-label="Сообщение агенту"></textarea>'+
  '<button class="send" id="sendBtn" type="submit" aria-label="Отправить" disabled><span class="ico" data-ico="send"></span></button></div><small>Enter — отправить, Shift+Enter — новая строка.</small></form>';
  const inp=document.getElementById('chatInput'),btn=document.getElementById('sendBtn');
  inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px';btn.disabled=busy||!inp.value.trim();});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.getElementById('chatForm').requestSubmit();}});
  document.getElementById('chatForm').addEventListener('submit',e=>{e.preventDefault();sendMsg(inp.value);});
  scrollChat();
}
function scrollChat(){const b=document.getElementById('chatBody');if(b)b.scrollTop=b.scrollHeight;}
function demoReply(a,text){
  const t=text.length>90?text.slice(0,90)+'…':text;
  const dn=docsOf(a.id).length;
  let r='Демонстрационный ответ агента «'+a.name+'». Вы написали: «'+t+'».';
  if(a.instr)r+='\n\nМоя роль: '+a.instr.slice(0,140)+(a.instr.length>140?'…':'');
  r+='\n\n'+(dn?'К агенту прикреплено документов: '+dn+', но в прототипе они не обрабатываются. ':'')+'Настоящий ответ появится после подключения API AI-агента.';
  return r;
}
function sendMsg(raw){
  const text=(raw||'').trim();
  if(!text||busy||!chatId)return;
  const a=getAgent(chatId),id=chatId;
  const conv=S.convs[id]||(S.convs[id]={updated:Date.now(),messages:[]});
  const um={role:'user',text,ts:Date.now()};
  conv.messages.push(um);conv.updated=um.ts;save('convs');
  const box=document.getElementById('chatMsgs'),inp=document.getElementById('chatInput');
  box.insertAdjacentHTML('beforeend',msgHtml(um,a));
  inp.value='';inp.style.height='auto';busy=true;document.getElementById('sendBtn').disabled=true;
  box.insertAdjacentHTML('beforeend','<div class="msg agent typing" id="typing" aria-label="Агент печатает">'+tile(a)+'<div class="bubble"><i></i><i></i><i></i></div></div>');
  scrollChat();
  setTimeout(()=>{
    const am={role:'agent',text:demoReply(a,text),ts:Date.now()};
    conv.messages.push(am);conv.updated=am.ts;save('convs');
    if(chatId===id){
      const ty=document.getElementById('typing');if(ty)ty.remove();
      document.getElementById('chatMsgs').insertAdjacentHTML('beforeend',msgHtml(am,a));
      busy=false;const i=document.getElementById('chatInput');document.getElementById('sendBtn').disabled=!i.value.trim();scrollChat();
    }
  },900+Math.random()*600);
}
async function clearChat(){
  if(!chatId||!S.convs[chatId])return toast('Чат уже пуст.');
  if(!(await confirmDlg('Очистить чат?','Сообщения этого разговора будут удалены из локального прототипа.','Очистить')))return;
  delete S.convs[chatId];save('convs');renderChat(chatId);toast('Чат очищен.');
}
</script>
<script>
/* Маршрутизация, форма агента, делегирование событий */
const NAV=[['overview','Обзор','home'],['catalog','Каталог','grid'],['agents','Мои агенты','users'],['docs','Документы','doc'],['history','История чатов','clock']];
const TAB=[['overview','Обзор','home'],['agents','Агенты','users'],['catalog','Каталог','grid'],['docs','Документы','doc'],['history','История','clock']];
const ROUTES={overview:renderOverview,catalog:renderCatalog,agents:renderAgents,docs:renderDocs,history:renderHistory,settings:renderSettings};

function hydrateIcons(root){(root||document).querySelectorAll('[data-ico]').forEach(el=>{if(!el.firstChild)el.innerHTML=icon(el.dataset.ico);});}

function buildNav(cur){
  document.getElementById('sideNav').innerHTML=NAV.map(n=>'<a class="nav-item'+(cur===n[0]?' active':'')+'" href="#/'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'><span class="ico">'+icon(n[2])+'</span><span>'+n[1]+'</span>'+(n[0]==='agents'?'<span class="count">'+S.agents.length+'</span>':n[0]==='docs'?'<span class="count">'+S.docs.length+'</span>':'')+'</a>').join('');
  document.getElementById('tabBar').innerHTML=TAB.map(n=>'<a href="#/'+n[0]+'"'+(cur===n[0]?' class="active" aria-current="page"':'')+'><span class="ico">'+icon(n[2])+'</span>'+n[1]+'</a>').join('');
  const st=document.querySelector('[data-nav=settings]');st.classList.toggle('active',cur==='settings');
}
function route(){
  const h=(location.hash||'#/overview').replace(/^#\/?/,'').split('/');
  let name=h[0]||'overview',arg=h[1];
  if(name==='chat'&&!(arg&&getAgent(arg)))name='overview';
  if(name!=='chat'&&!ROUTES[name])name='overview';
  document.querySelectorAll('[data-view]').forEach(v=>v.hidden=v.dataset.view!==(name==='chat'?'chat':name));
  document.body.classList.toggle('in-chat',name==='chat');
  if(name==='chat'){renderChat(arg);document.title=getAgent(arg).name+' — Мнемозина';}
  else{ROUTES[name]();document.title='Мнемозина';}
  buildNav(name==='chat'?(isMine(arg)?'agents':'catalog'):name);
  const view=document.querySelector('[data-view]:not([hidden])');hydrateIcons(view);hydrateIcons(document.querySelector('.sidebar'));
  if(name!=='chat')window.scrollTo(0,0);
}

/* форма агента */
let formIcon='bot',formColor=AGENT_COLORS[0][0];
function openAgentForm(id,preset){
  const a=id?S.agents.find(x=>x.id===id):null;
  const d=a||preset||{name:'',desc:'',instr:'',icon:'bot',color:AGENT_COLORS[0][0]};
  document.getElementById('agentDlgTitle').textContent=a?'Редактирование агента':'Новый агент';
  document.getElementById('fId').value=a?a.id:'';
  document.getElementById('fName').value=d.name;document.getElementById('fDesc').value=d.desc||'';document.getElementById('fInstr').value=d.instr||'';
  document.getElementById('fCount').textContent=(d.instr||'').length;
  document.getElementById('fName').closest('.field').classList.remove('invalid');document.getElementById('fNameErr').hidden=true;
  document.getElementById('iconPicker').innerHTML=AGENT_ICONS.map(i=>'<label><input type="radio" name="ic" value="'+i+'"'+(i===d.icon?' checked':'')+' aria-label="Иконка '+i+'"><span class="opt">'+icon(i)+'</span></label>').join('');
  document.getElementById('colorPicker').innerHTML=AGENT_COLORS.map(c=>'<label><input type="radio" name="cl" value="'+c[0]+'"'+(c[0]===d.color?' checked':'')+' aria-label="'+c[1]+'"><span class="sw" style="--c:'+c[0]+'"></span></label>').join('');
  const sv=document.getElementById('fSave');sv.disabled=false;sv.textContent='Сохранить';
  document.getElementById('agentDlg').showModal();
  setTimeout(()=>document.getElementById('fName').focus(),30);
}
function submitAgent(e){
  e.preventDefault();
  const name=document.getElementById('fName').value.trim();
  const f=document.getElementById('fName').closest('.field');
  if(!name){f.classList.add('invalid');document.getElementById('fNameErr').hidden=false;document.getElementById('fName').focus();toast('Укажите название агента.','error');return;}
  f.classList.remove('invalid');document.getElementById('fNameErr').hidden=true;
  const sv=document.getElementById('fSave');sv.disabled=true;sv.textContent='Сохранение…';
  const id=document.getElementById('fId').value;
  const data={name,desc:document.getElementById('fDesc').value.trim(),instr:document.getElementById('fInstr').value.trim(),
    icon:(document.querySelector('[name=ic]:checked')||{}).value||'bot',color:(document.querySelector('[name=cl]:checked')||{}).value||AGENT_COLORS[0][0]};
  setTimeout(()=>{
    let nid=id;
    if(id){Object.assign(S.agents.find(a=>a.id===id),data);}
    else{nid=uid('u-');S.agents.unshift(Object.assign({id:nid},data));}
    save('agents');document.getElementById('agentDlg').close();
    toast(id?'Изменения сохранены.':'Агент «'+name+'» создан.');
    route();
  },450);
}
async function deleteAgent(id){
  const a=S.agents.find(x=>x.id===id);if(!a)return;
  if(!(await confirmDlg('Удалить агента?','«'+a.name+'» будет удалён вместе с прикреплёнными документами и историей чата.')))return;
  S.agents=S.agents.filter(x=>x.id!==id);S.docs=S.docs.filter(d=>d.agentId!==id);delete S.convs[id];
  save('agents');save('docs');save('convs');toast('Агент удалён.');
  if(location.hash.startsWith('#/chat/'))location.hash='#/agents';else route();
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-action]');if(!t)return;
  const id=t.dataset.id;
  switch(t.dataset.action){
    case 'new-agent':openAgentForm();break;
    case 'close-agent':document.getElementById('agentDlg').close();break;
    case 'edit-agent':openAgentForm(id);break;
    case 'del-agent':deleteAgent(id);break;
    case 'open-chat':location.hash='#/chat/'+id;break;
    case 'clone-agent':{const a=getAgent(id);openAgentForm(null,{name:a.name+' (копия)',desc:a.desc,instr:a.instr,icon:a.icon,color:a.color});break;}
    case 'cat':S.ui.catCat=t.dataset.cat;renderCatalog();hydrateIcons(document.getElementById('view-catalog'));break;
    case 'reset-cat':S.ui.catCat='Все';S.ui.catQ='';renderCatalog();hydrateIcons(document.getElementById('view-catalog'));break;
    case 'del-doc':{const d=S.docs.find(x=>x.id===id);if(!d)break;
      if(await confirmDlg('Удалить файл?','«'+d.name+'» будет убран из списка документов агента.')){S.docs=S.docs.filter(x=>x.id!==id);save('docs');renderDocList();buildNav('docs');toast('Файл удалён из списка.');}break;}
    case 'demo-doc':addDemoDoc();buildNav('docs');break;
    case 'chat-back':history.length>1?history.back():(location.hash='#/overview');break;
    case 'tip':sendMsg(t.dataset.t);break;
    case 'clear-chat':clearChat();break;
    case 'reset-demo':
      if(await confirmDlg('Сбросить демо-данные?','Ваши агенты, документы и чаты вернутся к исходному состоянию.','Сбросить')){
        S.agents=[{id:'u-1',name:'Мой аналитик отчётов',desc:'Разбирает квартальные отчёты и готовит сводки для команды.',instr:'Отвечай кратко, используй списки и выделяй цифры.',icon:'chart',color:'#7c3aed'}];
        S.docs=[{id:'d1',agentId:'u-1',name:'Отчёт_Q1.pdf',ext:'pdf',size:2411724,status:'demo'}];S.convs=seedConvs();
        save('agents');save('docs');save('convs');toast('Демо-данные сброшены.');buildNav('settings');
      }break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='catSearch'){S.ui.catQ=e.target.value;renderCatalogGrid();}
  else if(e.target.id==='histSearch'){S.ui.histQ=e.target.value;renderHistList();}
  else if(e.target.id==='fInstr'){document.getElementById('fCount').textContent=e.target.value.length;}
  else if(e.target.id==='fName'&&e.target.value.trim()){e.target.closest('.field').classList.remove('invalid');document.getElementById('fNameErr').hidden=true;}
});
document.getElementById('agentForm').addEventListener('submit',submitAgent);
window.addEventListener('hashchange',route);
hydrateIcons(document);
route();
</script>
