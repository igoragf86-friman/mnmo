<!doctype html>
<html lang="ru">
  <meta charset="utf-8">
  <title>Вход</title>
  <h1>Вход</h1>

  {% if error %}<p>{{ error }}</p>{% endif %}

  <form method="post" action="/login">
    <label>Логин <input name="username" required></label><br>
    <label>Пароль <input name="password" type="password" required></label><br>
    <button type="submit">Войти</button>
  </form>
</html>
