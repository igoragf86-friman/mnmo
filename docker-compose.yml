services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_agents}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_user} -d ${POSTGRES_DB:-ai_agents}"]
      interval: 5s
      timeout: 5s
      retries: 20

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    restart: unless-stopped
    command:
      - --model-id
      - intfloat/multilingual-e5-base
      - --pooling
      - mean
      - --max-batch-tokens
      - "1024"
      - --max-concurrent-requests
      - "1"
    volumes:
      - hf_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

  qwen:
    image: ghcr.io/ggerganov/llama.cpp:server
    restart: unless-stopped
    # Если у вас GPU — раскомментируйте блок ниже и используйте тег server-cuda
    # image: ghcr.io/ggerganov/llama.cpp:server-cuda
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    command:
      - -m
      - /models/model.gguf
      - -c
      - "8192"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-ai_agents}
      EMBEDDING_BASE_URL: http://tei:80
      QWEN_BASE_URL: http://qwen:8080
    depends_on:
      db:
        condition: service_healthy
      tei:
        condition: service_started
      qwen:
        condition: service_started
    volumes:
      - ./var/documents:/app/var/documents
    ports:
      - "8000:8000"

volumes:
  pgdata:
  hf_cache: