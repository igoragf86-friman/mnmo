services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_agents}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_user} -d ${POSTGRES_DB:-ai_agents}"]
      interval: 5s
      timeout: 5s
      retries: 20

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    restart: unless-stopped
    command:
      - --model-id
      - intfloat/multilingual-e5-base
      - --pooling
      - mean
      - --max-batch-tokens
      - "2048"
      - --max-concurrent-requests
      - "4"
    volumes:
      - hf_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-ai_agents}
      EMBEDDING_BASE_URL: http://tei:80
    depends_on:
      db:
        condition: service_healthy
      tei:
        condition: service_started
    volumes:
      - ./var/documents:/app/var/documents

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro 
    depends_on:
      - app


volumes:
  pgdata:
  hf_cache: