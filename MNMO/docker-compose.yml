services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_platform_django
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - uploaded_files:/app/storage
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --timeout 300
      --graceful-timeout 30

volumes:
  uploaded_files: